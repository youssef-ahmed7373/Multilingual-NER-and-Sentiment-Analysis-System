version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: multilingual-ner-sentiment-api:latest
    container_name: ner-sentiment-api
    ports:
      - "8000:8000"
    volumes:
      - ./models/ner/final:/app/models/ner/final:ro
      - ./models/sentiment/final:/app/models/sentiment/final:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DEVICE=cpu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    image: multilingual-ner-sentiment-ui:latest
    container_name: ner-sentiment-ui
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stoppedversion: "3.9"

