#     "requests>=2.32.0",
# ]
# train = [
#     "wandb>=0.27.2",
# ]

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-gpu" }


[tool.setuptools.packages.find]
where = ["."]
include = ["configs*", "models*", "NLP*"]
namespaces = false

